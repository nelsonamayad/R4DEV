project:
  type: website
  output-dir: _blog
  render:
    - "**/*.qmd"
    - "!MyBlog/"
    - "!param_reports/"
    - "!shiny/"

execute:
  freeze: auto      # only re-execute R code in files that changed
  warning: false

lang: en

brand:
  light: _brand.yml
  dark: _brand-dark.yml

website:
  title: "R4DEV"
  description: "Data workshop on reproducible analysis and visualisation using R, created by Nelson Amaya D."
  favicon: logo/r4dev_dalle_1.png
  site-url: https://nelsonamayad.github.io/R4DEV/

  google-analytics:
    tracking-id: "G-CE27LT98M2"
  cookie-consent: true

  twitter-card:
    image: logo/r4dev_dalle_1.png
    title: "R4DEV"
    description: "Data workshop created by Nelson Amaya D."
    card-style: summary
    creator: "@nelsonamayad"

  open-graph:
    image: logo/r4dev_dalle_1.png
    title: "R4DEV"
    description: "Data workshop created by Nelson Amaya D."

  search:
    location: navbar
    type: overlay

  page-navigation: true
  back-to-top-navigation: true

  navbar:
    logo: logo/r4dev_dalle_1.png
    title: false
    background: primary
    foreground: white
    style: floating

    left:
      - text: "Home"
        icon: "house-door"
        href: index.qmd
      - text: "Start here"
        icon: "signpost-2"
        href: start.qmd
      - text: "Build with R"
        icon: "code-slash"
        menu:
          - text: "Track overview"
            icon: "mortarboard"
            href: learn/build-with-r.qmd
          - text: "1. Blogging with Quarto"
            icon: "book-half"
            href: sessions_workshop/01-quarto/01-quarto.qmd
          - text: "2. Everything in its right place"
            icon: "music-note-list"
            href: sessions_workshop/02-plots/02-plots.qmd
          - text: "3. Data from words"
            icon: "textarea-t"
            href: sessions_workshop/03-text/03-text.qmd
          - text: "4. What books are about"
            icon: "book"
            href: sessions_workshop/04-topics/04-topics.qmd
          - text: "5. Making data move"
            icon: "film"
            href: sessions_workshop/05-animate/05-animate.qmd
          - text: "6. Mapping despair in the USA"
            icon: "globe"
            href: sessions_workshop/06-maps/06-maps.qmd
          - text: "7. Just take it"
            icon: "wifi"
            href: sessions_workshop/07-scrap/07-scrap.qmd
          - text: "8. Make it shine"
            icon: "stars"
            href: sessions_workshop/08-shiny/08-shiny.qmd
          - text: "9. Smart reports"
            icon: "android2"
            href: sessions_workshop/09-reports/09-reports.qmd
          - text: "10. Do it well, do it fast"
            icon: "speedometer2"
            href: sessions_workshop/10-parallel/10-parallel.qmd
      - text: "Work with AI"
        icon: "robot"
        menu:
          - text: "Track overview"
            icon: "mortarboard"
            href: learn/ai.qmd
          - text: "1. Talking to machines"
            icon: "robot"
            href: sessions_ai/01-llm/01-llm.qmd
          - text: "2. Chat with your data"
            icon: "chat-dots"
            href: sessions_ai/02-llm-apps/02-llm-apps.qmd
