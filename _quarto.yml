            icon: "stars"
            href: sessions_ai/03-ragnar/03-ragnar.qmd#capstone-ask-r4dev
      - text: "Think with data"
        icon: "dice-5"
        menu:
          - text: "Track overview"
            icon: "mortarboard"
            href: learn/thinking.qmd
          - text: "1. Embrace the noise"
            icon: "dice-5"
            href: sessions_thinking/01-uncertainty/01-uncertainty.qmd
          - text: "2. There is only one test"
            icon: "shuffle"
            href: sessions_thinking/02-inference/02-inference.qmd
          - text: "3. All models are wrong"
            icon: "graph-up"
            href: sessions_thinking/03-regression/03-regression.qmd
          - text: "4. Draw your assumptions"
            icon: "diagram-3"
