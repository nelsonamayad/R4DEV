    right:
      - text: "About R4DEV"
        icon: "question-circle-fill"
        href: about.qmd

  page-footer:
    left: "📉 R4DEV 📈"

    center: |
      <span class="faux-block">Licensed under<br>[{{< fa brands creative-commons >}} {{< fa brands creative-commons-by >}} Creative Commons CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)</span>

    right: |
      <span class="faux-block">Created with {{< fa brands r-project title="R" >}} R and [Quarto](https://quarto.org/)</span>

    background: primary

format:
  html:
    theme:
      light: [journal, brand]
      dark: [journal, brand]
    respect-user-color-scheme: true
    toc: true
    toc-location: left
    code-fold: show
    code-summary: "Show the code"
    code-tools:
      toggle: true
      source: false
    code-link: true
    code-copy: true
    code-annotations: hover
    highlight-style:
      light: github
      dark: github-dark
    footnotes-hover: true
    link-external-newwindow: true
    smooth-scroll: true
    lightbox: true
    css: style.css

comments:
  hypothesis: true
