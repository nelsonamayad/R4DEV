<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;800&display=block" rel="stylesheet">
<style>
  :root { --teal: #4FB3C9; --deepteal: #226F7F; --orange: #FF7A55; --abyss: #10191F; --mist: #D9E6EC; --slate: #8FA3A8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Roboto Condensed", sans-serif;
    color: var(--mist);
    background:
      radial-gradient(55% 80% at 92% 18%, rgba(79,179,201,0.20), transparent 70%),
      radial-gradient(45% 70% at 0% 100%, rgba(255,122,85,0.13), transparent 70%),
      var(--abyss);
    display: grid;
    grid-template-columns: 1fr 330px;
    align-items: center;
    gap: 56px;
    padding: 0 84px 0 88px;
    position: relative;
  }
  body::after { /* thin brand rule along the bottom, like the site's masthead */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
    background: linear-gradient(90deg, var(--deepteal), var(--teal) 55%, var(--orange));
  }
  .kicker { display: flex; align-items: center; gap: 14px; font-size: 19px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--teal); }
  .kicker::before { content: ""; width: 42px; height: 3px; background: var(--orange); border-radius: 2px; }
  h1 { margin-top: 22px; font-size: 64px; line-height: 1.06; font-weight: 800; color: #fff; letter-spacing: -0.01em; }
  h1 em { font-style: normal; color: var(--orange); }
  p.lede { margin-top: 24px; font-size: 27px; line-height: 1.35; color: var(--mist); max-width: 690px; }
  .tracks { margin-top: 34px; display: flex; gap: 12px; }
  .chip { font-size: 21px; font-weight: 700; padding: 9px 18px; border-radius: 999px; border: 2px solid; }
  .chip.build { color: var(--teal); border-color: rgba(79,179,201,.55); }
  .chip.ai { color: var(--orange); border-color: rgba(255,122,85,.55); }
  .chip.think { color: #C9B8A8; border-color: rgba(201,184,168,.5); }
  .url { margin-top: 30px; font-size: 21px; color: var(--slate); letter-spacing: .02em; }
  .url b { color: var(--mist); font-weight: 700; }
  .logo { width: 330px; filter: drop-shadow(0 18px 40px rgba(79,179,201,.28)); }
</style>
</head>
<body>
  <div>
    <div class="kicker">The data workshop · R + Quarto</div>
    <h1>More fiction is written in<br><em>Excel</em> than in Word.</h1>
    <p class="lede">Reproducible analysis, visualisation, apps and AI workflows <span style="white-space:nowrap">— all in R.</span> Twenty free, hands-on lessons on real data.</p>
    <div class="tracks">
      <span class="chip build">Build with R</span>
      <span class="chip ai">Work with AI</span>
      <span class="chip think">Think with data</span>
    </div>
    <div class="url"><b>nelsonamayad.github.io/R4DEV</b></div>
  </div>
  <img class="logo" src="../../logo/r4dev_dalle_1.png" alt="">
</body>
</html>
