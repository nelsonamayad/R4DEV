# R4DEV brand — light mode (dark mode: _brand-dark.yml)

meta:
  name:
    short: R4DEV
    full: "R4DEV — R for Development"
  description: >-
    Data workshop on reproducible analysis and visualisation with R,
    created by Nelson Amaya D.
  link:
    home: https://nelsonamayad.github.io/R4DEV

logo:
  images:
    main:
      path: logo/r4dev_logo.png
      alt: "R4DEV logo"
  small: main
  medium: main

color:
  palette:
    teal: "#226F7F"    # primary accent, navbar
    orange: "#F75431"  # highlights and accents (3.35:1 on white -- too light for body-size link text)
    rust: "#C2401F"    # links -- WCAG AA on paper (5.19:1) and on cloud cards (4.6:1)
    slate: "#5C6B70"   # muted secondary text/elements
    cloud: "#EEF2F3"   # subtle panel/table-stripe surfaces
    paper: "#FFFFFF"   # page background — clean, no tint
    ink: "#20242A"     # body text
  background: paper
  foreground: ink
  primary: teal
  secondary: slate
  tertiary: cloud

typography:
  fonts:
    - family: Roboto Condensed
      source: google
      weight: [300, 400, 700]
    - family: Fira Code
      source: google
      weight: [400, 500]
  base: Roboto Condensed
  headings:
    family: Roboto Condensed
    weight: 700
  monospace: Fira Code
  link:
    color: rust
